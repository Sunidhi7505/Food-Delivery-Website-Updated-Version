<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foody | Forgot Password</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body data-page="login">
  <div class="app-shell">
    <nav class="navbar">
      <div class="brand" onclick="window.location.href='index.html'">
        <span class="brand-mark"><i data-lucide="utensils"></i></span>
        <span>Foody</span>
      </div>
      <ul id="navLinks"></ul>
    </nav>

    <main class="auth-page">
      <form id="forgotForm" class="panel auth-card">
        <p class="eyebrow">Account recovery</p>
        <h1>Forgot password</h1>
        <p class="muted">Enter your email and we will send a reset link valid for 15 minutes.</p>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" placeholder="you@example.com" required />
        </div>

        <button class="btn btn-primary" type="submit" style="width:100%;">
          <i data-lucide="mail"></i>Send reset link
        </button>
        <p class="auth-switch"><a href="login.html">Back to login</a></p>
      </form>
    </main>
  </div>
</body>
</html>
